name: Release

# Push a version tag (for example `npm version patch && git push --follow-tags`)
# to build the Windows installer and publish it as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Build installer and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm run typecheck

      - name: Build installer
        run: npx electron-vite build && npx electron-builder --win --publish never --config electron-builder.yml

      - uses: softprops/action-gh-release@v3
        with:
          name: FiveM Server Manager ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*-Setup.exe
            dist/*-Setup.exe.blockmap
            dist/latest.yml
